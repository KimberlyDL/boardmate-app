<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>DormLink</title>

    <base href="/" />

    <meta name="description" content="Find a boarding house near your school, and manage rooms, bills and tenants." />
    <meta name="color-scheme" content="light dark" />
    <meta name="theme-color" content="#e9f8f0" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#0c1914" media="(prefers-color-scheme: dark)" />
    <meta
      name="viewport"
      content="viewport-fit=cover, width=device-width, initial-scale=1.0, minimum-scale=1.0, maximum-scale=1.0, user-scalable=no"
    />
    <meta name="format-detection" content="telephone=no" />
    <meta name="msapplication-tap-highlight" content="no" />

    <link rel="icon" type="image/png" href="/favicon.png" />
    <link rel="icon" type="image/svg+xml" href="/icons/icon.svg" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon-180x180.png" />

    <!-- add to homescreen for ios -->
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="DormLink" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  </head>

  <body>
    <div id="app">
      <!-- First-load screen (DlLoader "house trace"); Vue replaces it when the app mounts. -->
      <style>
        #dl-boot { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; background: #e9f8f0; }
        #dl-boot .o { fill: none; stroke: oklch(0.8 0.13 88); stroke-opacity: 0.45; stroke-width: 1.6; stroke-linejoin: round; }
        #dl-boot .t { fill: none; stroke: oklch(0.48 0.1 165); stroke-width: 2; stroke-linejoin: round; stroke-linecap: round; stroke-dasharray: 120; animation: dl-boot-trace 1.8s ease-in-out infinite; }
        @keyframes dl-boot-trace { 0% { stroke-dashoffset: 120; } 55% { stroke-dashoffset: 0; } 100% { stroke-dashoffset: -120; } }
        @keyframes dl-boot-breathe { 0%, 100% { opacity: 1; } 50% { opacity: 0.35; } }
        @media (prefers-color-scheme: dark) { #dl-boot { background: #0c1914; } #dl-boot .t { stroke: oklch(0.74 0.11 165); } }
        @media (prefers-reduced-motion: reduce) { #dl-boot .t { stroke-dashoffset: 0; animation: dl-boot-breathe 1.6s ease-in-out infinite; } }
      </style>
      <div id="dl-boot" role="status" aria-label="Loading DormLink">
        <svg width="56" height="56" viewBox="0 0 32 32" aria-hidden="true">
          <path class="o" d="M5 15 L16 6 L27 15 L27 27 L5 27 Z" />
          <path class="t" d="M5 15 L16 6 L27 15 L27 27 L5 27 Z M13 27 L13 19 L19 19 L19 27" />
        </svg>
      </div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>

</html>

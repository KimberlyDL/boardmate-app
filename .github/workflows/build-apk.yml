name: Build DormLink Android APK

# Builds a debug APK in the cloud (no Android Studio needed) and attaches it to the run.
# Needs (Settings > Secrets and variables > Actions):
#   Variable ANDROID_API_URL          where the app finds the API, e.g.
#                                       https://api.example.com/api    (deployed backend)
#                                       http://192.168.1.10:8000/api   (backend on your PC, phone on the same Wi-Fi)
#   Variable GOOGLE_WEB_CLIENT_ID     the Web OAuth client ID (same as GOOGLE_CLIENT_ID on the backend);
#                                     leave unset to build without the Google button
#   Secret   ANDROID_DEBUG_KEYSTORE   your PC's ~/.android/debug.keystore as base64, so every APK has the
#                                     SHA-1 registered in Google Cloud and Google sign-in works

on:
  push:
    branches:
      - master
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout project
        uses: actions/checkout@v4

      # The API address and Google client ID live in .env.android, which is not in Git; write it from the repo variables.
      - name: Write .env.android
        env:
          ANDROID_API_URL: ${{ vars.ANDROID_API_URL }}
          GOOGLE_WEB_CLIENT_ID: ${{ vars.GOOGLE_WEB_CLIENT_ID }}
        run: |
          if [ -z "$ANDROID_API_URL" ]; then
            echo "::error::Set the repository variable ANDROID_API_URL (Settings > Secrets and variables > Actions > Variables)."
            exit 1
          fi
          echo "VITE_API_URL=$ANDROID_API_URL" > .env.android
          echo "VITE_GOOGLE_CLIENT_ID=$GOOGLE_WEB_CLIENT_ID" >> .env.android
          echo "API address bundled into the app: $ANDROID_API_URL"
          if [ -z "$GOOGLE_WEB_CLIENT_ID" ]; then
            echo "::warning::GOOGLE_WEB_CLIENT_ID is not set; the app will build without the Google button."
          fi

      - name: Set up Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install npm dependencies
        run: npm ci

      # Capacitor Android compiles with Java 21.
      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Check Java version
        run: |
          java -version
          javac -version

      # Type check, web build with .env.android, then copy it into the Android project.
      - name: Build web app and sync Android
        run: npm run build:android

      - name: Make Gradle executable
        run: chmod +x android/gradlew

      # Sign with the same debug key as your PC, so the APK's SHA-1 matches the Android client
      # in Google Cloud. Without it, the runner makes a new random key and Google sign-in fails.
      # The key's path is passed to Gradle in DEBUG_KEYSTORE_PATH (android/app/build.gradle reads
      # it), because Gradle on the runner does not reliably use ~/.android/debug.keystore.
      - name: Restore debug signing key
        env:
          ANDROID_DEBUG_KEYSTORE: ${{ secrets.ANDROID_DEBUG_KEYSTORE }}
        run: |
          if [ -z "$ANDROID_DEBUG_KEYSTORE" ]; then
            echo "::warning::Secret ANDROID_DEBUG_KEYSTORE is not set; using a random key, so Google sign-in will not work in this APK."
            exit 0
          fi
          KEYSTORE="$RUNNER_TEMP/debug.keystore"
          # Line breaks or spaces from copy-pasting are dropped before decoding
          printf '%s' "$ANDROID_DEBUG_KEYSTORE" | tr -d ' \r\n' | base64 --decode > "$KEYSTORE"
          echo "DEBUG_KEYSTORE_PATH=$KEYSTORE" >> "$GITHUB_ENV"
          # The SHA-1 is public; compare it with the Android client in Google Cloud
          keytool -list -v -keystore "$KEYSTORE" -storepass android -alias androiddebugkey | grep 'SHA1:'

      - name: Build debug APK
        working-directory: android
        run: ./gradlew --no-daemon assembleDebug

      # Stop the run if the APK was not signed with the restored key, so a build that
      # Google sign-in would reject is never uploaded.
      - name: Check APK signing key
        run: |
          APK=android/app/build/outputs/apk/debug/app-debug.apk
          APKSIGNER=$(ls -d "$ANDROID_HOME"/build-tools/*/ | sort -V | tail -n 1)apksigner
          APK_SHA1=$("$APKSIGNER" verify --print-certs "$APK" | grep 'SHA-1 digest' | head -n 1 | awk '{print $NF}' | tr 'a-f' 'A-F')
          echo "APK signed with SHA-1: $APK_SHA1"
          if [ -z "$DEBUG_KEYSTORE_PATH" ]; then
            echo "::warning::No shared debug key, so this APK's SHA-1 is not registered in Google Cloud."
            exit 0
          fi
          KEY_SHA1=$(keytool -list -v -keystore "$DEBUG_KEYSTORE_PATH" -storepass android -alias androiddebugkey | grep 'SHA1:' | awk '{print $NF}' | tr -d ':')
          if [ "$APK_SHA1" != "$KEY_SHA1" ]; then
            echo "::error::The APK is signed with SHA-1 $APK_SHA1, not the shared debug key ($KEY_SHA1). Google sign-in would fail."
            exit 1
          fi
          echo "APK is signed with the shared debug key."

      - name: Name the APK
        run: cp android/app/build/outputs/apk/debug/app-debug.apk DormLink.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: DormLink-APK
          path: DormLink.apk
          if-no-files-found: error
          retention-days: 30

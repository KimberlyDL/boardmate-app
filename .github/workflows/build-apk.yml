name: Build DormLink Android APK

# Builds a debug APK in the cloud (no Android Studio needed) and attaches it to the run.
# Needs the repository variable ANDROID_API_URL: where the app finds the API, e.g.
#   http://192.168.1.10:8000/api   (backend on your PC, phone on the same Wi-Fi)
#   https://api.example.com/api     (deployed backend)

on:
  push:
    branches:
      - master
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout project
        uses: actions/checkout@v4

      # The API address lives in .env.android, which is not in Git; write it from the repo variable.
      - name: Write .env.android
        env:
          ANDROID_API_URL: ${{ vars.ANDROID_API_URL }}
        run: |
          if [ -z "$ANDROID_API_URL" ]; then
            echo "::error::Set the repository variable ANDROID_API_URL (Settings > Secrets and variables > Actions > Variables)."
            exit 1
          fi
          echo "VITE_API_URL=$ANDROID_API_URL" > .env.android
          echo "API address bundled into the app: $ANDROID_API_URL"

      - name: Set up Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install npm dependencies
        run: npm ci

      # Capacitor Android compiles with Java 21.
      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Check Java version
        run: |
          java -version
          javac -version

      # Type check, web build with .env.android, then copy it into the Android project.
      - name: Build web app and sync Android
        run: npm run build:android

      - name: Make Gradle executable
        run: chmod +x android/gradlew

      - name: Build debug APK
        working-directory: android
        run: ./gradlew --no-daemon assembleDebug

      - name: Name the APK
        run: cp android/app/build/outputs/apk/debug/app-debug.apk DormLink.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: DormLink-APK
          path: DormLink.apk
          if-no-files-found: error
          retention-days: 30
